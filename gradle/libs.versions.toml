# Single source of truth for dependency versions (design doc §6.4). Supported Minecraft versions
# live in minecraft-versions.properties (ADR-0011).
# Libraries that Minecraft also ships (gson, slf4j) are pinned to the exact versions in the
# Minecraft version manifests so Plexus Mod Loader and the game share one copy on the classpath (ADR-0005); with
# several Minecraft versions, use the oldest version any of them ships.

[versions]
# Java of the version-independent modules: the lowest Java of all supported Minecraft versions.
java = "25"
asm = "9.11.1"
gson = "2.14.0"
guava = "33.6.0-jre"
slf4j = "2.0.17"
junit = "6.1.3"
spotless = "8.10.4"
palantirJavaFormat = "2.102.0"
fabricLoader = "0.19.5"
# Mixin and MixinExtras at the versions Fabric Loader 0.19.5 ships (its fabric-installer.json and META-INF/jars).
mixin = "0.17.4+mixin.0.8.7"
mixinExtras = "0.5.5"
# Fabric API 0.161.0+26.2 nests these module versions; the NeoForge host modules (ADR-0031) compile against them.
fabricApiBase = "2.0.4+ece063239e"
fabricResourceLoaderV1 = "2.0.13+9edec1269e"
fabricLifecycleEventsV1 = "4.1.4+29b6eb019e"
fabricTagApiV1 = "2.1.4+515ac5339e"
fabricConventionTagsV2 = "4.7.1+1f023a9e9e"
fabricRecipeApiV1 = "9.0.22+11e1c9a39e"
fabricResourceConditionsApiV1 = "6.1.0+10e9a28b9e"
fabricTransitiveAccessWidenersV1 = "8.1.4+67c847259e"
# The same module as Fabric API 0.165.0+26.3 nests it, for the NeoForge 26.3 host modules.
fabricTransitiveAccessWidenersV1Mc263 = "8.1.17+e2f63d3e5d"
# Fabric API 0.165.0+26.3's item module, which the MinecraftForge 26.3 content registries host module compiles against.
fabricItemApiV1Mc263 = "14.8.0+d1c0d72b5d"
jspecify = "1.0.0"
jetbrainsAnnotations = "26.0.2"
# Quilt Loader (Apache-2.0): its public API and version classes are packed into the Fabric bridge jar (ADR-0027).
quiltLoader = "0.31.0-beta.4"
# Real Quilt Loader's own launcher profile for 0.31.0-beta.4 (meta.quiltmc.org/v3 .../server/json), used only by the
# quiltLoaderReference check that runs real Quilt Loader (Quilt full support Q10), never shipped.
quiltReferenceAsm = "9.10.1"
quiltJson5 = "1.0.4+final"
quiltConfig = "1.3.3"
tomlj = "1.1.1"
# LZMA for Forge's binary patches (data/<side>.lzma), ADR-0021 G2.
xz = "1.9"
# Forge's launcher API, compiled against (never shipped): Plexus Mod Loader implements ModLauncher's contracts for FML
# (ADR-0021). The versions Forge 26.2-65.1.5 uses; the jars themselves come from Forge's Maven on the player's PC.
forgeModlauncher = "10.2.6"
forgeSecuremodules = "2.2.24"
# With securemodules, the jars Forge's shim puts on the JVM class path: Java finds file system and URL providers there
# only, so FML's union and jar-in-jar file systems need them on Plexus Mod Loader's class path too (ADR-0021).
forgeUnsafe = "0.9.2"
# FML's loader, for Plexus Mod Loader's game test launch handler (a CommonLaunchHandler); compiled against only.
forgeFml = "26.2-65.1.5"
# The MinecraftForge release Plexus Mod Loader pins for 26.3; its Fabric API host modules compile against it (ADR-0031).
forge263 = "26.3-66.1.0"
forgeSpi = "8.0.0"
# The event bus of the pinned Forge release; the Forge test mods compile against it, with Forge and FML (ADR-0021 G4).
forgeEventbus = "7.0.5"
forgeJarJar = "0.4.2"
forgeRoimfs = "1.0.0"
# Forge's distribution markers (Dist, OnlyIn), which Forge's classes carry; the Forge host modules compile against them.
forgeMergetoolApi = "1.0"
# Forge 47.4.28 (Minecraft 1.20.1) has an older launcher API than the 26.x builds above (ModLauncher 10.0.9, FML 47 launch
# handlers without launch types); the one launch handler written against it compiles against these (ADR-0038).
forge47Fml = "1.20.1-47.4.28"
forge47Modlauncher = "10.0.9"
forge47Securejarhandler = "2.1.10"
forge47Spi = "7.0.1"
forge47Mergetool = "1.1.5"
# NeoForge's FancyModLoader and its distribution markers, compiled against (never shipped): Plexus Mod Loader's host
# for FML 11 (ADR-0026). The versions NeoForge 26.2.0.93 uses; the jars come from NeoForge's Maven on the player's PC.
neoforgeFml = "11.0.16"
# FML 12, which NeoForge 26.3.0.98 uses: NeoForgeSharedMixinPatchTest checks the patch against its classes too.
neoforgeFml12 = "12.0.12"
neoforgeMergetool = "2.0.7"
# FML 4, which NeoForge 21.1.265 (Minecraft 1.21.1) uses, with the ModLauncher and securejarhandler it runs on (ADR-0043):
# Plexus Mod Loader's host for NeoForge on ModLauncher is compiled against them (never shipped).
neoforgeFml4 = "4.0.45"
neoforgeModlauncher11 = "11.0.5"
neoforgeSecurejarhandler3 = "3.0.8"
# FML 2, which NeoForge 20.4.253 (Minecraft 1.20.4) uses; it runs on ModLauncher 10.0.9 (the forge47 versions below).
neoforgeFml2 = "2.0.17"
neoforgeSecurejarhandler2 = "2.1.24"
# The NeoForge release and its event bus the NeoForge test mods compile against (ADR-0026).
neoforge = "26.2.0.93"
# The NeoForge release Plexus Mod Loader pins for 26.3; its Fabric API host modules compile against it (ADR-0031).
neoforge263 = "26.3.0.98"
neoforgeBus = "8.0.5"
# The Maven version ranges FML checks mods.toml with (a Forge library; Plexus Mod Loader's tests use the same).
mavenArtifact = "3.8.8"
# The config library of Forge 26.2-65.1.5, for the test of Plexus Mod Loader's fix to it (NightConfigEmptyFilePatch).
nightConfig = "3.7.4"
# The option parser ModLauncher's API uses; Minecraft ships this version, so FML's services share the game's copy.
joptSimple = "5.0.4"

