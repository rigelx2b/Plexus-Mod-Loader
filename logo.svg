<svg xmlns="http://www.w3.org/2000/svg" viewBox="87.5 99.5 337 337" width="512" height="512" fill="none">
  <title>Plexus: Deconstructed Prism Nodes</title>
  <defs>
    <linearGradient id="plexus-cyan" gradientUnits="userSpaceOnUse" x1="212.7" y1="106" x2="126.1" y2="281">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="plexus-purple" gradientUnits="userSpaceOnUse" x1="299.3" y1="106" x2="385.9" y2="281">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="plexus-indigo" gradientUnits="userSpaceOnUse" x1="169.4" y1="356" x2="342.6" y2="406">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="plexus-core" gradientUnits="userSpaceOnUse" x1="187" y1="176" x2="325" y2="336">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Outer floating wings: chevrons on an R=150 hex centerline; 50px strokes keep outer edges inside R=180 and leave a ~32px channel to the core -->
  <g stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left wing -->
    <polyline points="212.7,131 126.1,181 126.1,281" stroke="url(#plexus-cyan)"/>
    <!-- Top-Right wing -->
    <polyline points="299.3,131 385.9,181 385.9,281" stroke="url(#plexus-purple)"/>
    <!-- Bottom wing -->
    <polyline points="169.4,356 256,406 342.6,356" stroke="url(#plexus-indigo)"/>
  </g>

  <!-- Precision-cut core crystal on the inner hexagon anchors -->
  <polygon points="256,176 325,216 325,296 256,336 187,296 187,216"
           fill="url(#plexus-core)" stroke="url(#plexus-core)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Pinwheel facet cuts (non-cube) -->
  <polygon points="256,176 325,216 256,256" fill="#FFFFFF" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="256,336 187,296 256,256" fill="#1E1B4B" fill-opacity="0.32" stroke="#1E1B4B" stroke-opacity="0.32" stroke-width="2" stroke-linejoin="round"/>
</svg>